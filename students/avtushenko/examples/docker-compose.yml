version: '3.8'

services:
  # RabbitMQ Event Bus
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: courses_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservices_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Course Service Database
  course-db:
    image: postgres:15-alpine
    container_name: courses_db
    environment:
      POSTGRES_USER: courses_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: courses
    ports:
      - "5432:5432"
    networks:
      - microservices_network
    volumes:
      - course_db_data:/var/lib/postgresql/data

  # Enrollment Service Database
  enrollment-db:
    image: postgres:15-alpine
    container_name: enrollments_db
    environment:
      POSTGRES_USER: enrollments_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: enrollments
    ports:
      - "5433:5432"
    networks:
      - microservices_network
    volumes:
      - enrollment_db_data:/var/lib/postgresql/data

  # Course Service
  course-service:
    build: ./services/course-service
    container_name: course_service
    environment:
      COURSE_DATABASE_URL: postgresql://courses_user:password@course-db:5432/courses
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8001:8001"
    networks:
      - microservices_network
    depends_on:
      rabbitmq:
        condition: service_healthy
      course-db:
        condition: service_started
    restart: unless-stopped

  # Enrollment Service
  enrollment-service:
    build: ./services/enrollment-service
    container_name: enrollment_service
    environment:
      ENROLLMENT_DATABASE_URL: postgresql://enrollments_user:password@enrollment-db:5432/enrollments
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      COURSE_SERVICE_URL: http://course-service:8001
    ports:
      - "8002:8002"
    networks:
      - microservices_network
    depends_on:
      rabbitmq:
        condition: service_healthy
      enrollment-db:
        condition: service_started
      course-service:
        condition: service_started
    restart: unless-stopped

  # Notification Service
  notification-service:
    build: ./services/notification-service
    container_name: notification_service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    networks:
      - microservices_network
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api_gateway
    ports:
      - "80:80"
    networks:
      - microservices_network
    depends_on:
      - course-service
      - enrollment-service
    restart: unless-stopped

networks:
  microservices_network:
    driver: bridge

volumes:
  course_db_data:
  enrollment_db_data: